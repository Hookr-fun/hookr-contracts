# The profile the deployed code was compiled under. Solidity 0.8.26 through
# via-IR, the optimizer at 200 runs, Cancun, and the IPFS metadata hash appended
# to every contract, which is what lets a block explorer report a full match
# rather than a partial one. The remappings are written out rather than detected
# because a contract's metadata records them, and that metadata is hashed into
# the bytes it carries.
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
bytecode_hash = "ipfs"
cbor_metadata = true
auto_detect_remappings = false
remappings = [
    "@uniswap/v4-core/=lib/v4-core/",
    "forge-std/=lib/forge-std/src/",
    "@ensdomains/=lib/v4-core/node_modules/@ensdomains/",
    "@openzeppelin/=lib/v4-core/lib/openzeppelin-contracts/",
    "ds-test/=lib/v4-core/lib/forge-std/lib/ds-test/src/",
    "erc4626-tests/=lib/v4-core/lib/openzeppelin-contracts/lib/erc4626-tests/",
    "hardhat/=lib/v4-core/node_modules/hardhat/",
    "openzeppelin-contracts/=lib/v4-core/lib/openzeppelin-contracts/",
    "solmate/=lib/v4-core/lib/solmate/",
    "v4-core/=lib/v4-core/src/"
]

[profile.default.fuzz]
runs = 256

[profile.ci]
verbosity = 3

# The six recapture-root files are byte-pinned exports (SOURCE_MANIFEST.json pins each one's
# sha256 to the deployed source), and forge fmt would rewrite three of them. They are excluded
# from `forge fmt --check` rather than reformatted; the check still covers every other file.
[fmt]
ignore = [
    "src/HookrModularHookV6WthV5.sol",
    "src/HookrSwapKernelV5Wth.sol",
    "src/HookrWthExecutorAdapterV1.sol",
    "src/interfaces/IHookrExecutionClockV1.sol",
    "src/interfaces/IWthArbitrageExecutorV1.sol",
    "src/libraries/HookrModularCorrectionLibV3.sol",
]
