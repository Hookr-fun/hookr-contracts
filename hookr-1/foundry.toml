# Hookr 1, as deployed on Robinhood Chain (chain id 4663). The compiler settings are the release's; the remappings
# point at this repository's pinned submodules in ../lib, which hold the same commits the release was built with.
# The verified metadata records the release's own dependency paths, so a build from here matches the deployed code
# up to the metadata hash. For a byte-exact build, metadata hash included, use standard-input.mjs (README.md).
#
# The release's tests (test/README.md) build in the same profile. Every src file still compiles with 0.8.37 and the
# settings below. The PoolManager fixture builds v4-core's PoolManager with 0.8.26, the version it is deployed with,
# and every other test file compiles with 0.8.37.
[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["../lib"]
remappings = [
    "@uniswap/v4-core/=../lib/v4-core/",
    "forge-std/=../lib/forge-std/src/",
    "@openzeppelin/contracts/=../lib/v4-core/lib/openzeppelin-contracts/contracts/",
    "solmate/=../lib/v4-core/lib/solmate/",
]
auto_detect_remappings = false
auto_detect_solc = true
compilation_restrictions = [
    { paths = "src/**", version = "=0.8.37" },
    { paths = "script/**", version = "=0.8.37" },
    { paths = "test/fixtures/PoolManagerArtifact.sol", version = "=0.8.26" },
    { paths = "test/fixtures/{CyclingExecutor,MockSanctionsList,PushExecutor}.sol", version = "=0.8.37" },
    { paths = "test/{base,bench,compliance,core,docs,engagement,extensions,factory,gasless,invariant,kit,lane,libraries,mocks,owned,periphery,support,utils}/**", version = "=0.8.37" },
]
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "prague"
bytecode_hash = "ipfs"
use_literal_content = true
# The artifacts carry each unit's AST, as the release's test build did; tests read selectors, code and link references
# from out/ and nothing else.
ast = true
ffi = false
fs_permissions = [{ access = "read", path = "./out" }]
# A whole-suite fork run reads Robinhood Chain 4663 at this block unless a test pins its own.
fork_block_number = 74062645
# The lane suites (test/lane) run only under the lane profiles, which isolate every top-level call.
no_match_path = "test/lane/**"
# The fork tests (every contract named *Fork*, and QuoteLookAlikesTest) read Robinhood Chain 4663 and run only under
# the fork profiles below. Without an RPC they would pass or skip without running anything.
no_match_contract = "Fork|QuoteLookAlikes"
# Gas is measured into snapshots/ only on request: the benches run isolated, where every number is a whole transaction,
# and a plain `forge test` runs them non-isolated with other numbers, so it neither rewrites nor checks the files.
# Check them with `FORGE_SNAPSHOT_CHECK=true forge test --isolate --match-path '<bench path>'` (test/README.md).
gas_snapshot_emit = false

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = true

# Fuzz profiles with a fixed seed, so a failure reproduces on the same commit (Uniswap's pr, ci and debug profiles; the
# run counts are lower than theirs because every test here deploys a PoolManager fixture). `pr` is the quick pass, `ci`
# the long one, `debug` the fast local loop. The code does not compile without via-IR, so debug keeps the shipped build
# and lowers the runs to 100 and the invariant campaigns to a smoke drive.
[profile.pr.fuzz]
runs = 1_000
seed = "0x4444"

[profile.ci.fuzz]
runs = 5_000
seed = "0x4444"

[profile.debug.fuzz]
runs = 100
seed = "0x4444"

[profile.debug.invariant]
runs = 16
depth = 16
fail_on_revert = true

# Deep invariant campaign (test/invariant/run.sh deep): more and longer runs than the default profile, same compiler
# settings. Not isolated: under --isolate forge runs every call a handler makes as its own transaction, which splits
# the one-transaction bundles and the transient-ledger reads the system handlers check.
[profile.deep.invariant]
runs = 512
depth = 256
fail_on_revert = true

# The arb recapture lane's suites (test/lane): every top-level call is its own transaction, so EIP-1153 transient
# state resets between calls as on chain. A profile inherits the default's settings, its no_match_path included, so
# each lane profile replaces it with a pattern no file matches; otherwise it would select no test and pass.
[profile.lane]
isolate = true
match_path = "test/lane/**"
no_match_path = "test/lane/**/*.none"
# QuoteLeg's selector check reads HookrRoot's artifact from out/, and parsing it takes more gas than forge's default.
gas_limit = 4000000000

[profile.lane.invariant]
runs = 64
depth = 32
fail_on_revert = true

# Deep lane campaign (test/invariant/run.sh lane-deep): more and longer runs, isolated as the lane profile.
[profile.lane-deep]
isolate = true
match_path = "test/lane/**"
no_match_path = "test/lane/**/*.none"
gas_limit = 4000000000

[profile.lane-deep.invariant]
runs = 256
depth = 128
fail_on_revert = true

# Fork tests against Robinhood Chain 4663, each at the block it pins: `fork` runs those outside test/lane, `lane-fork`
# the lane's, isolated. They read ALCHEMY_RPC_URL and fork through an rpc alias named robinhood. This repository keeps
# no RPC table (CONTRIBUTING.md), so the alias lives in your own Foundry config (test/README.md).
[profile.fork]
match_contract = "Fork|QuoteLookAlikes"
# Replaces the default's no_match_contract with a pattern no contract name matches.
no_match_contract = "^$"

[profile.lane-fork]
isolate = true
match_path = "test/lane/fork/**"
no_match_path = "test/lane/**/*.none"
no_match_contract = "^$"
gas_limit = 4000000000

[lint]
lint_on_build = false
