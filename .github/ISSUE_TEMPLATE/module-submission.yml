name: Advisory submission
description: An advisory with code and tests, for review against IHookrAdvisory and the conformance suite
title: "advisory: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        For an advisory that compiles and has tests, in a public repository at a pinned commit. Start from `hookr-1/test/kit/TemplateAdvisory.sol` and inherit `hookr-1/test/kit/AdvisoryConformance.sol` in its test. A review here says whether the advisory fits what the registry admits on HookrRoot; it admits nothing. The registry admits an advisory at its exact code hash, behind a timelock, and pools bind it at launch. This issue is public: no contact details, no keys, no unpublished addresses.
  - type: input
    id: source
    attributes:
      label: Source
      description: A public repository URL plus a 40-character commit.
      placeholder: "https://github.com/owner/repo at 0123…"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Bind data
      description: What bind takes, its bounds, and what it rejects.
    validations:
      required: true
  - type: textarea
    id: maxima
    attributes:
      label: Requested maxima
      description: The most the advisory will ever ask for, as the caps and gas limit its admission would declare.
      placeholder: |
        maxLpFeePips:
        maxQuoteTakePips:
        maxSubjectTakeBps:
        gasLimit:
    validations:
      required: true
  - type: input
    id: gas
    attributes:
      label: Gas per callback, if measured
      description: From forge test --gas-report or a trace. Say which callback. Leave blank if not measured.
  - type: textarea
    id: tests
    attributes:
      label: Tests run
      description: The exact command and the summary line it printed.
      placeholder: |
        forge test --match-contract MyAdvisoryConformanceTest
        Ran 16 tests ... 16 passed
    validations:
      required: true
  - type: dropdown
    id: block
    attributes:
      label: Does it refuse swaps or take from them?
      description: A fail-open advisory may neither refuse a swap nor take from it. One that does either runs fail closed.
      options:
        - No, it only adds a fee surcharge
        - Yes, it refuses or takes
        - Not sure
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: Public
      options:
        - label: This issue contains no private contact details, no secrets and no unpublished addresses.
          required: true
