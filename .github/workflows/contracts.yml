name: Contracts

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Source provenance, boundary, build and sizes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the package and its submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Verify the source manifest
        run: node check-source-manifest.mjs

      - name: Verify the package boundary
        run: node check-review-boundary.mjs

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: |
          # The aggregate via-IR build hit SIGSEGV on the default stack.
          ulimit -s 65536
          forge build --jobs 1

      - name: Check runtime sizes against the EIP-170 limit
        run: |
          ulimit -s 65536
          forge build --jobs 1 --sizes

      - name: Check the storage layout against STORAGE_LAYOUT.json
        run: |
          ulimit -s 65536
          node check-storage-layout.mjs

  labs:
    name: Labs templates and prototypes build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the package and its submodules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          version: v1.7.1

      - name: Check labs formatting
        run: forge fmt --check --root labs

      - name: Build labs
        run: |
          ulimit -s 65536
          forge build --root labs

      - name: Test labs
        run: |
          ulimit -s 65536
          forge test --root labs
