[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# read-only: the UI->contract bridge fixture generated by builder-combo-matrix.test.ts
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"

[fuzz]
runs = 256

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"

# NOTE: no [etherscan] section — Foundry's chain registry rejects chain id 4663 for
# etherscan-config resolution. Verify with:
#   forge verify-contract <addr> <Contract> --verifier blockscout \
#     --verifier-url https://robinhoodchain.blockscout.com/api --chain-id 4663
