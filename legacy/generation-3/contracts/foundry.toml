[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# read-only: the UI->contract bridge fixture generated by builder-combo-matrix.test.ts
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
# Single unified compiler version for every source in every import graph.
# 0.8.27+ minimum: 0.8.26 hits "Internal compiler error: Assembly exception for bytecode"
# (imprecise immutable-size accounting, fixed by solidity PR #15354) on the current
# launchpad/hook. The vendored v4-core submodule pins PoolManager.sol to exactly 0.8.26;
# its pragma is widened locally to ^0.8.26 by ONE tracked line so 0.8.28 satisfies the
# whole graph. Re-apply that one-liner after any submodule bump.
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
bytecode_hash = "none"

[fuzz]
runs = 256

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"
# Multi-chain targets (DeployHookr.s.sol). Dry runs only until each chain has a
# reviewed, promoted release; no [etherscan] section exists for them either.
base = "https://mainnet.base.org"
mainnet = "https://ethereum-rpc.publicnode.com"
unichain = "https://mainnet.unichain.org"

# NOTE: no [etherscan] section — Foundry's chain registry rejects chain id 4663 for
# etherscan-config resolution. Verify with:
#   forge verify-contract <addr> <Contract> --verifier blockscout \
#     --verifier-url https://robinhoodchain.blockscout.com/api --chain-id 4663
# Base and Ethereum mainnet use the standard Etherscan V2 API:
#   forge verify-contract <addr> <Contract> --verifier etherscan \
#     --etherscan-api-key "$ETHERSCAN_API_KEY" \
#     --verifier-url https://api.etherscan.io/v2/api --chain-id <8453|1>
